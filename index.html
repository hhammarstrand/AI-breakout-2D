<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="BLACKOUT // Operation Lifeline: a pixel-art escape-room adventure. Outwit a rogue building AI before the purge." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='2' y='3' width='12' height='9' fill='none' stroke='%230aff7a' stroke-width='1.5'/%3E%3Crect x='5' y='6' width='2' height='2' fill='%234ae6ff'/%3E%3Crect x='9' y='6' width='2' height='2' fill='%23ff5a5a'/%3E%3Crect x='6' y='13' width='4' height='1.5' fill='%230aff7a'/%3E%3C/svg%3E" />
    <title>BLACKOUT // Operation Lifeline — 2D</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="no-hud">
    <div id="app">
      <header id="hud">
        <span class="brand" data-text="BLACKOUT // Operation Lifeline">BLACKOUT <em>//</em> Operation Lifeline</span>
        <div class="hud-cell" id="hud-progress">
          <span class="hud-label" id="hud-act">ACT I</span>
          <span class="pips" id="hud-pips"></span>
        </div>
        <div class="hud-cell" id="hud-score">
          <span class="hud-label" data-i18n="SCORE">SCORE</span>
          <span class="hud-value" id="hud-score-value">0000</span>
        </div>
        <div class="hud-cell" id="hud-code">
          <span class="hud-label" data-i18n="UPLINK CODE">UPLINK CODE</span>
          <span class="hud-value code" id="hud-code-value">◇L1 ◇L2 ◇R3</span>
        </div>
        <div class="hud-cell" id="hud-timer">
          <span class="hud-label" data-i18n="CONTAINMENT">CONTAINMENT</span>
          <span class="hud-value" id="hud-timer-value">25:00</span>
          <span class="timer-bar"><span id="hud-timer-fill"></span></span>
        </div>
        <button type="button" class="hud-btn" id="hud-sfx" tabindex="-1">♪ SFX ON</button>
      </header>

      <main id="stage">
        <canvas id="game" width="480" height="320"></canvas>
        <div id="boot" aria-live="polite">BOOTING…</div>
        <div id="objective" aria-live="polite"></div>
        <div id="toasts" aria-live="polite"></div>
        <div id="pa" aria-live="polite"><span class="pa-tag">◉ HALCYON</span><span class="pa-text"></span></div>
        <div id="dialog" class="dialog hidden" role="dialog" aria-live="polite">
          <canvas class="dialog-portrait" width="48" height="48"></canvas>
          <div class="dialog-body">
            <div class="dialog-head">
              <span class="dialog-speaker"></span>
              <span class="dialog-page"></span>
            </div>
            <div class="dialog-text"></div>
          </div>
          <div class="dialog-hint">▼</div>
        </div>
        <div id="touch" aria-hidden="true">
          <div class="dpad">
            <button data-action="up" class="t-up">▲</button>
            <button data-action="left" class="t-left">◀</button>
            <button data-action="right" class="t-right">▶</button>
            <button data-action="down" class="t-down">▼</button>
          </div>
          <div class="abtns">
            <button data-action="hint" class="t-hint">?</button>
            <button data-action="pause" class="t-select">SELECT</button>
            <button data-action="submit" class="t-start">START</button>
            <button data-action="back" class="t-b">B</button>
            <button data-action="interact" class="t-a">A</button>
          </div>
        </div>
        <div id="flash" aria-hidden="true"></div>
        <div id="crt" aria-hidden="true"></div>
      </main>

      <footer id="legend">
        <span><span data-i18n="move">move</span> <kbd>WASD</kbd>/<kbd data-i18n="arrows">arrows</kbd></span>
        <span><span data-i18n="interact">interact</span> <kbd>space</kbd>/<kbd>E</kbd></span>
        <span><span data-i18n="run">run</span> <kbd>Shift</kbd></span>
        <span><span data-i18n="menu">menu</span> <kbd>Tab</kbd></span>
        <span><span data-i18n="flashlight">flashlight</span> <kbd>F</kbd></span>
        <span><span data-i18n="hint">hint</span> <kbd>H</kbd></span>
        <span><span data-i18n="pause">pause</span> <kbd>Esc</kbd></span>
        <span><span data-i18n="sound">sound</span> <kbd>M</kbd></span>
      </footer>
    </div>

    <script>
      // Until main.js has booted, a failure leaves a message instead of a silent black screen.
      function bootFailed(msg) {
        if (document.body.classList.contains("booted")) return;
        var el = document.getElementById("boot");
        if (el) { el.className = "failed"; el.textContent = "BOOT FAILED — " + msg + " — reload to retry"; }
      }
      window.addEventListener("error", function (e) { bootFailed(e.message || "script error"); });
    </script>
    <script type="module" src="./src/main.js" onerror="bootFailed('could not load the game files')"></script>
  </body>
</html>
