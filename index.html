<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BLACKOUT // Operation Lifeline — 2D</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <span class="brand">BLACKOUT <em>//</em> Operation Lifeline</span>
        <span class="hud-cell" id="hud-progress">PROGRESS 0/4</span>
        <span class="hud-cell" id="hud-score">SCORE 0</span>
        <span class="hud-cell" id="hud-timer">CONTAINMENT 60:00</span>
        <span class="hud-cell" id="hud-sfx">SFX ON</span>
      </header>

      <main id="stage">
        <canvas id="game" width="720" height="480"></canvas>
        <div id="dialog" class="dialog hidden" role="dialog" aria-live="polite">
          <div class="dialog-speaker"></div>
          <div class="dialog-text"></div>
          <div class="dialog-hint">[space] continue</div>
        </div>
        <div id="crt" aria-hidden="true"></div>
      </main>

      <footer id="legend">
        <span>move <kbd>WASD</kbd>/<kbd>arrows</kbd></span>
        <span>interact <kbd>space</kbd>/<kbd>E</kbd></span>
        <span>pause <kbd>Esc</kbd></span>
      </footer>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
